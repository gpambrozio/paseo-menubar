name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      # scripts/native-bundle.mjs signs and notarizes when it is given an
      # identity, so without credentials the packaging step can only fail -- and
      # a red run on a tag says "the release is broken" when the real state is
      # "the release was built by hand". Skip that step instead, and keep
      # typecheck and tests running so the tag still gets verified.
      #
      # This is mapped into `env` because the `secrets` context is not available
      # in an `if:` condition, at either job or step level.
      HAVE_SIGNING_CREDENTIALS: ${{ secrets.SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
      # A runner image's default Xcode is not a contract, and
      # `swift-tools-version: 6.1` needs Xcode 16.3 or newer -- Xcode 15 cannot
      # read the manifest at all. Select the newest Xcode the image carries and
      # print the version, so a too-old image fails here with a number in the
      # log rather than inside a manifest parse error.
      - run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      - run: npm run typecheck
      - run: npx vitest run
      - run: swift test --package-path PaseoIconPackage
      # Builds and verifies; deliberately does not publish. The script signs,
      # notarizes and staples before it writes the dmg and zip, so the artifacts
      # on disk are the ones Gatekeeper accepts -- but uploading stays manual,
      # because the cask's checksum is taken from the uploaded bytes and the
      # tap workflow is run by hand afterwards.
      #
      # `codesign` reads the Developer ID certificate from a keychain, and a
      # runner has none, so this step cannot sign on CI as written. Importing a
      # base64 .p12 into a temporary keychain is what that would need. The three
      # APPLE_* variables below are what notarization itself uses.
      - if: env.HAVE_SIGNING_CREDENTIALS == 'true'
        # On a tag the version is the tag; on a manual dispatch there is no tag
        # and GITHUB_REF_NAME is a branch, which the version check rejects by
        # design -- fall back to package.json rather than packaging "main".
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_TYPE" in tag) ;; *) version="$(node -p 'require("./package.json").version')" ;; esac
          npm run dist -- --version "$version" --identity "$SIGNING_IDENTITY"
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          # APPLE_ID is the Apple account email, APPLE_APP_SPECIFIC_PASSWORD an
          # app-specific password from appleid.apple.com (not the account
          # password), and APPLE_TEAM_ID the 10-character team from the
          # certificate's common name.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: env.HAVE_SIGNING_CREDENTIALS != 'true'
        run: |
          echo "::notice title=Packaging skipped::No signing secrets on this repo, so the dmg was not built here. Release artifacts are built by hand with 'npm run dist -- --version <x.y.z> --identity \"Developer ID Application: ...\"' and uploaded with 'gh release upload'. See the known issues in AGENTS.md."
