# appId derives from the author's own domain, gustavo.eng.br. Changing it later
# breaks auto-update and Keychain entries for existing installs, so be sure of
# it before the first published release rather than after.
appId: br.eng.gustavo.paseo-menubar
productName: Paseo Icon
executableName: PaseoIcon
directories:
  output: release
files:
  - dist/**/*
  - assets/generated/**/*
  - "!**/*.map"
  # The app icon is input to `mac.icon` below, which electron-builder turns into
  # the bundle's .icns. Nothing loads it at runtime, so shipping it inside the
  # asar as well would just be a second 1024px copy.
  - "!assets/generated/icon.png"
publish:
  provider: github
  owner: gpambrozio
  repo: paseo-menubar
mac:
  category: public.app-category.developer-tools
  # Generated by `npm run icons`, not committed. electron-builder converts the
  # 1024px PNG into the .icns itself, so there is no iconset to keep in sync.
  icon: assets/generated/icon.png
  target:
    - dmg
    - zip
  hardenedRuntime: true
  # Requires a Developer ID Application certificate plus APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID in the environment. On a
  # machine with the certificate in its login keychain, electron-builder finds
  # the identity on its own; CI needs it as base64 in CSC_LINK with
  # CSC_KEY_PASSWORD. Without credentials the build fails rather than quietly
  # shipping something Gatekeeper will block.
  notarize: true
  extendInfo:
    # No dock icon; this app is the menu bar item.
    LSUIElement: 1
dmg:
  # electron-builder defaults this to false and only notarizes the .app, which
  # leaves the file people actually download unsigned -- `spctl -a -t open`
  # rejects it with "no usable signature". Apple's rule is that a signed disk
  # image must also be notarized, so this flag on its own would trade one bad
  # state for a worse one: `scripts/notarize-dmg.mjs` runs after
  # electron-builder and is what makes the pair valid. Don't set this true
  # without that step, and don't remove that step while this is true.
  sign: true
